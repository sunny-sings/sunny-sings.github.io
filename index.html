<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌊 Sunny · sun_singer — живые песни в TikTok</title>
<meta name="description" content="Живое караоке в TikTok: репертуар, заказ песни, донаты">
<meta name="theme-color" content="#0e0b16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">

  <header class="head">
    <div class="ava">🎤</div>
    <h1>🌊 Sunny <span>· @sun_singer</span></h1>
    <p class="sub">Живой эфир каждый вечер — из дома на колёсах в Португалии. Заказывай песни, поём вместе! 💛</p>
    <div class="live" id="live" hidden><i></i> <span id="live-t">Сейчас в эфире</span></div>
  </header>

  <nav class="links" id="links"></nav>

  <section id="ladder-box" hidden>
    <h2>🎯 Песни за лайки</h2>
    <p class="hint">Набираем лайки — пою следующую песню. Заказ за донат или подарок встаёт сразу следующим.</p>
    <ol class="ladder" id="ladder"></ol>
  </section>

  <section id="songs">
    <h2>🎶 Репертуар <small id="count"></small></h2>
    <input id="q" class="search" placeholder="Поиск: исполнитель или песня…" autocomplete="off">
    <div id="list" class="list"><p class="hint">Загружаю…</p></div>
  </section>

  <footer class="foot">
    <a id="foot-tt" target="_blank" rel="noopener">TikTok @sun_singer</a>
  </footer>
</main>

<!-- окно заказа -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <button class="x" data-close aria-label="Закрыть">✕</button>
    <h3 id="s-title"></h3>
    <div id="s-body"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
